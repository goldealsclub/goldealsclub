name: Daily TikTok video

on:
  schedule:
    # 06:00 UTC every day (07h Paris hiver / 08h Paris été)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      style:
        description: "Forcer l'habillage (vide = rotation du jour) : adidas, zara ou nike"
        required: false
        default: ""
      publish:
        description: "Publier (site + réseaux) si les contrôles passent ; non = test à blanc"
        type: boolean
        required: false
        default: true
      networks:
        description: "Réseaux : all, facebook, instagram ou none (site seulement)"
        required: false
        default: "all"
      theme:
        description: "Une seule vidéo (vide = les 4) : sneakers, vetements, accessoires ou enfants"
        required: false
        default: ""

jobs:
  cutout-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify approved cutout references
        run: bun run qa:cutout
      - name: Upload cutout report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cutout-qa-report
          path: |
            remotion/qa/cutout/current/*.png
            remotion/qa/cutout/diff/*.png
            remotion/qa/cutout/report.json
          retention-days: 14

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        style: [adidas, zara, nike]
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y chromium-browser ffmpeg && exit 0
            echo "::warning::apt-get a échoué (tentative $i)"; sleep 20
          done
          exit 1
      - run: bun install --frozen-lockfile
      - name: Prepare Remotion compositor
        run: |
          mkdir -p node_modules/@remotion/compositor-linux-x64-gnu
          cp node_modules/@remotion/compositor-linux-x64-musl/remotion node_modules/@remotion/compositor-linux-x64-gnu/remotion
          chmod +x node_modules/@remotion/compositor-linux-x64-gnu/remotion
          ln -sf "$(which ffmpeg)" node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg
          ln -sf "$(which ffprobe)" node_modules/@remotion/compositor-linux-x64-gnu/ffprobe
      - name: Verify approved ${{ matrix.style }} frames
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: bun run qa:${{ matrix.style }}

  generate:
    needs: [cutout-qa, visual-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # 4 vidéos par jour ; l'habillage (adidas/zara/nike) tourne chaque jour.
        theme: [sneakers, vetements, accessoires, enfants]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Style graphique du jour pour ce thème
        run: |
          THEMES=(sneakers vetements accessoires enfants); STYLES=(adidas zara nike)
          for i in "${!THEMES[@]}"; do [ "${THEMES[$i]}" = "${{ matrix.theme }}" ] && IDX=$i; done
          DAY=$(( $(date -u +%s) / 86400 ))
          STYLE=${STYLES[$(( (IDX + DAY) % 3 ))]}
          [ -n "${{ github.event.inputs.style }}" ] && STYLE="${{ github.event.inputs.style }}"
          echo "STYLE=$STYLE" >> $GITHUB_ENV
          echo "Thème ${{ matrix.theme }} → style $STYLE"

      - name: Skip non-selected theme
        if: ${{ github.event.inputs.theme != '' && github.event.inputs.theme != matrix.theme }}
        run: echo "skip=true" >> $GITHUB_ENV

      - name: Dry run (no publishing)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false' }}
        run: echo "dryrun=true" >> $GITHUB_ENV

      - name: Setup Bun
        if: ${{ env.skip != 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Install ffmpeg + chromium
        if: ${{ env.skip != 'true' }}
        # Les miroirs apt échouent parfois (code 100) : 3 tentatives avant d'abandonner.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y ffmpeg chromium-browser && exit 0
            echo "::warning::apt-get a échoué (tentative $i), nouvel essai dans 20 s"; sleep 20
          done
          exit 1

      - name: Install Remotion deps
        if: ${{ env.skip != 'true' }}
        working-directory: remotion
        run: bun install --frozen-lockfile

      # Détourage IA des photos produits (u2net) : enlève sol, reflet et cadre du studio.
      - name: Cache AI cutout model
        if: ${{ env.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-v1

      - name: Install AI cutout (rembg)
        if: ${{ env.skip != 'true' }}
        run: |
          pip install --quiet "rembg[cpu]==2.0.85" \
            || pip install --quiet --break-system-packages "rembg[cpu]==2.0.85" \
            || echo "::warning::rembg indisponible, détourage classique"
          python3 -c "from rembg import new_session; new_session('u2net')" || true

      - name: Prepare Remotion compositor
        if: ${{ env.skip != 'true' }}
        working-directory: remotion
        run: |
          mkdir -p node_modules/@remotion/compositor-linux-x64-gnu
          cp node_modules/@remotion/compositor-linux-x64-musl/remotion node_modules/@remotion/compositor-linux-x64-gnu/remotion
          chmod +x node_modules/@remotion/compositor-linux-x64-gnu/remotion
          ln -sf "$(which ffmpeg)" node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg
          ln -sf "$(which ffprobe)" node_modules/@remotion/compositor-linux-x64-gnu/ffprobe

      # Historique des produits montrés les jours précédents (les 3 styles), pour ne
      # pas remontrer les mêmes modèles : conservé dans le cache GitHub Actions.
      - name: Restore video history (sneakers)
        if: ${{ env.skip != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: remotion/.history/sneakers.json
          key: video-history-sneakers-${{ github.run_id }}
          restore-keys: video-history-sneakers-
      - name: Restore video history (vetements)
        if: ${{ env.skip != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: remotion/.history/vetements.json
          key: video-history-vetements-${{ github.run_id }}
          restore-keys: video-history-vetements-
      - name: Restore video history (accessoires)
        if: ${{ env.skip != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: remotion/.history/accessoires.json
          key: video-history-accessoires-${{ github.run_id }}
          restore-keys: video-history-accessoires-
      - name: Restore video history (enfants)
        if: ${{ env.skip != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: remotion/.history/enfants.json
          key: video-history-enfants-${{ github.run_id }}
          restore-keys: video-history-enfants-

      - name: Generate video (${{ env.STYLE }})
        if: ${{ env.skip != 'true' }}
        working-directory: remotion
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          VIDEO_HISTORY_DIR: ${{ github.workspace }}/remotion/.history
          VIDEO_THEME: ${{ matrix.theme }}
        run: |
          sudo mkdir -p /mnt/documents
          sudo chmod 777 /mnt/documents
          node scripts/generate-variant.mjs top --style=${{ env.STYLE }}

      - name: Verify video before publishing
        if: ${{ env.skip != 'true' }}
        run: |
          VIDEO=$(ls -t /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.mp4 | head -n1)
          node remotion/scripts/verify-video.mjs "$VIDEO"

      - name: Save video history
        if: ${{ success() && env.skip != 'true' && env.dryrun != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: remotion/.history/${{ matrix.theme }}.json
          key: video-history-${{ matrix.theme }}-${{ github.run_id }}

      - name: Publish to the site
        if: ${{ env.skip != 'true' && env.dryrun != 'true' }}
        env:
          VIDEO_PUBLISH_TOKEN: ${{ secrets.VIDEO_PUBLISH_TOKEN }}
        run: |
          VIDEO=$(ls -t /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.mp4 | head -n1)
          echo "Publishing $VIDEO"
          node remotion/scripts/publish-video.mjs "$VIDEO" \
            --style=${{ env.STYLE }} \
            --category=${{ matrix.theme }} \
            --label="Sélection ${{ matrix.theme }} du jour"

      - name: Publish to Facebook + Instagram (Reels)
        # Réactivé le 19/10 : publication seulement si « Verify video before publishing » a réussi.
        if: ${{ env.skip != 'true' && env.dryrun != 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          VIDEO=$(ls -t /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.mp4 | head -n1)
          NETWORKS="${{ github.event.inputs.networks }}"
          ONLY=""; if [ -n "$NETWORKS" ] && [ "$NETWORKS" != "all" ]; then ONLY="--only=$NETWORKS"; fi
          node remotion/scripts/publish-social.mjs "$VIDEO" --style=${{ env.STYLE }} $ONLY

      - name: Upload as workflow artifact (backup)
        if: ${{ always() && env.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ matrix.theme }}
          path: |
            /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.mp4
            /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.txt
            /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.json
            /mnt/documents/goldeals-tiktok-*-${{ env.STYLE }}-*.png
          retention-days: 14
