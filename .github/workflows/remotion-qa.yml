name: Remotion QA visuelle

# Un check distinct par scène (intro / deal / outro) pour voir immédiatement
# laquelle régresse et sur quelle métrique. Un job d'agrégation final poste
# un commentaire PR consolidé avec le tableau des 3 scènes et un lien vers
# l'artifact des diffs visuels.
on:
  pull_request:
    paths:
      - "remotion/**"
      - ".github/workflows/remotion-qa.yml"
  workflow_dispatch:
    inputs:
      jitter:
        description: "Seuil jitter global (%) — vide = valeur du fichier qa/thresholds.json"
        required: false
        default: ""
      visual:
        description: "Seuil visuel global (%) — vide = valeur du fichier qa/thresholds.json"
        required: false
        default: ""
      pixelmatch:
        description: "Sensibilité pixelmatch (0 strict → 1 laxiste) — vide = défaut"
        required: false
        default: ""
      jitter_intro:
        description: "Override jitter intro (%)"
        required: false
        default: ""
      jitter_deal:
        description: "Override jitter deal (%)"
        required: false
        default: ""
      jitter_outro:
        description: "Override jitter outro (%)"
        required: false
        default: ""
      visual_intro:
        description: "Override visuel intro (%) — toutes phases"
        required: false
        default: ""
      visual_deal:
        description: "Override visuel deal (%) — toutes phases"
        required: false
        default: ""
      visual_outro:
        description: "Override visuel outro (%) — toutes phases"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    name: QA · ${{ matrix.scene }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scene: [intro, deal, outro]
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: Install Chromium + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg

      - name: Install Remotion deps
        run: bun install --frozen-lockfile

      - name: Patch compositor (musl + ffmpeg symlinks)
        run: |
          mkdir -p node_modules/@remotion/compositor-linux-x64-gnu
          cp node_modules/@remotion/compositor-linux-x64-musl/remotion \
             node_modules/@remotion/compositor-linux-x64-gnu/remotion
          chmod +x node_modules/@remotion/compositor-linux-x64-gnu/remotion
          ln -sf "$(which ffmpeg)"  node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg
          ln -sf "$(which ffprobe)" node_modules/@remotion/compositor-linux-x64-gnu/ffprobe

      - name: Run QA — scene ${{ matrix.scene }}
        id: qa
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          # Surcharges de seuils via les inputs workflow_dispatch.
          # Vide = on laisse qa/thresholds.json décider.
          QA_JITTER:        ${{ inputs.jitter }}
          QA_VISUAL:        ${{ inputs.visual }}
          QA_PIXELMATCH:    ${{ inputs.pixelmatch }}
          QA_JITTER_INTRO:  ${{ inputs.jitter_intro }}
          QA_JITTER_DEAL:   ${{ inputs.jitter_deal }}
          QA_JITTER_OUTRO:  ${{ inputs.jitter_outro }}
          QA_VISUAL_INTRO:  ${{ inputs.visual_intro }}
          QA_VISUAL_DEAL:   ${{ inputs.visual_deal }}
          QA_VISUAL_OUTRO:  ${{ inputs.visual_outro }}
        # On capture l'exit code mais on continue pour pouvoir uploader
        # l'artifact et écrire le step summary avant de faire échouer le check.
        continue-on-error: true
        run: |
          set +e
          node scripts/qa-frames.mjs \
            --scene=${{ matrix.scene }} \
            --report=qa/report-${{ matrix.scene }}.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Scene step summary
        if: always()
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const p = "qa/report-${{ matrix.scene }}.json";
          if (!fs.existsSync(p)) { console.log("⚠️ Pas de rapport pour ${{ matrix.scene }}."); process.exit(0); }
          const r = JSON.parse(fs.readFileSync(p, "utf8"));
          const s = r.scenes[0];
          const mark = (ok) => ok ? "✅" : "❌";
          const cell = (v) => !v ? "—"
            : v.status === "baseline-written" ? "📌 baseline"
            : `${mark(v.ok)} **${v.diffPct}%** (seuil ${v.threshold}%)`;
          const out = [];
          out.push(`## 🎬 Scène ${s.name}`);
          out.push("");
          out.push(r.regressions > 0
            ? `❌ **${r.regressions} métrique(s) en régression**`
            : "✅ Scène OK");
          out.push("");
          out.push("| Métrique | Résultat |");
          out.push("|---|---|");
          out.push(`| 🌀 Jitter (settled vs +1) | ${s.jitter ? `${mark(s.jitter.ok)} **${s.jitter.diffPct}%** (seuil ${s.jitter.threshold}%)` : "—"} |`);
          out.push(`| 🖼 Visual · entry        | ${cell(s.visual.entry)} |`);
          out.push(`| 🖼 Visual · settled (halos) | ${cell(s.visual.settled)} |`);
          out.push(`| 🖼 Visual · exit         | ${cell(s.visual.exit)} |`);
          console.log(out.join("\n"));
          EOF

      - name: Upload scene artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-qa-${{ matrix.scene }}
          path: |
            remotion/qa/current/${{ matrix.scene }}-*.png
            remotion/qa/diff/${{ matrix.scene }}-*.png
            remotion/qa/report-${{ matrix.scene }}.json
          retention-days: 14

      - name: Fail scene check on regression
        if: steps.qa.outputs.exit_code != '0'
        run: |
          echo "Régression sur la scène ${{ matrix.scene }} — voir l'artifact remotion-qa-${{ matrix.scene }}."
          exit 1

  summary:
    name: QA · résumé PR
    needs: qa
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all scene reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: remotion-qa-*

      - name: Build consolidated comment
        run: |
          node <<'EOF' > /tmp/comment.md
          const fs = require("fs"), path = require("path");
          const scenes = ["intro", "deal", "outro"];
          const reports = {};
          let totalRegressions = 0, missing = [];
          for (const name of scenes) {
            const p = path.join("artifacts", `remotion-qa-${name}`, `report-${name}.json`);
            if (!fs.existsSync(p)) { missing.push(name); continue; }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            reports[name] = r.scenes[0];
            totalRegressions += r.regressions || 0;
          }
          const mark = (ok) => ok ? "✅" : "❌";
          const cell = (v) => !v ? "—"
            : v.status === "baseline-written" ? "📌 baseline"
            : `${mark(v.ok)} ${v.diffPct}%`;
          const out = [];
          out.push("## 🎬 Remotion QA visuelle");
          out.push("");
          out.push(totalRegressions > 0
            ? `❌ **${totalRegressions} régression(s)** détectée(s).`
            : "✅ Aucune régression visuelle ni tremblement sur les 3 scènes.");
          if (missing.length) out.push(`\n⚠️ Rapports manquants : ${missing.join(", ")}`);
          out.push("");
          out.push("| Scène | 🌀 Jitter | 🖼 entry | 🖼 settled (halos) | 🖼 exit |");
          out.push("|---|---|---|---|---|");
          for (const name of scenes) {
            const s = reports[name];
            if (!s) { out.push(`| **${name}** | ⚠️ | ⚠️ | ⚠️ | ⚠️ |`); continue; }
            const j = s.jitter ? `${mark(s.jitter.ok)} ${s.jitter.diffPct}%` : "—";
            out.push(`| **${name}** | ${j} | ${cell(s.visual.entry)} | ${cell(s.visual.settled)} | ${cell(s.visual.exit)} |`);
          }
          out.push("");
          out.push("Détail par scène : voir les checks **QA · intro / deal / outro** ci-dessus (chacun a son step summary + son artifact diff).");
          if (totalRegressions > 0) {
            out.push("");
            out.push("Si le changement est intentionnel, régénère les baselines :");
            out.push("```bash");
            out.push("cd remotion && bun qa:update");
            out.push("git add remotion/qa/baseline && git commit -m 'qa: bump baselines'");
            out.push("```");
          }
          console.log(out.join("\n"));
          EOF
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- remotion-qa-comment -->";
            const full = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
            }
