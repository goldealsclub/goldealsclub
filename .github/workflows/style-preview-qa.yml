name: StylePreview visual QA

on:
  pull_request:
    paths:
      - "src/components/admin/StylePreview.tsx"
      - "src/pages/AdminStylePreviewQAPage.tsx"
      - "src/pages/AdminVideoPage.tsx"
      - "scripts/qa-style-preview.mjs"
      - "qa/style-preview/baseline/**"
      - ".github/workflows/style-preview-qa.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          (bun run dev > /tmp/vite.log 2>&1 &) && \
          for i in {1..40}; do
            curl -sf http://localhost:8080 > /dev/null && exit 0
            sleep 1
          done
          echo "Dev server failed to start"; cat /tmp/vite.log; exit 1
      - name: Run visual QA
        run: node scripts/qa-style-preview.mjs
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: style-preview-diffs
          path: qa/style-preview/
          if-no-files-found: ignore
